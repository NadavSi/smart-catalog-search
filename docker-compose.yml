# Self-contained: its own network, its own database, and nothing mounted
# from outside this folder.
name: catalog-search

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: assignments-db
      DB_PORT: 5432
      DB_DATABASE: assignmentsDB
      DB_USERNAME: assignments
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${APP_PORT:-8095}:8000"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      assignments-db:
        condition: service_healthy

  assignments-db:
    image: pgvector/pgvector:pg16
    container_name: assignmentsDB
    restart: unless-stopped
    environment:
      POSTGRES_DB: assignmentsDB
      POSTGRES_USER: assignments
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - assignments_db:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assignments -d assignmentsDB"]
      interval: 5s
      retries: 20

volumes:
  assignments_db:
